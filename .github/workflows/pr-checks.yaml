name: pull-request checks

on:
  pull_request:
    types:
      - opened
      - edited
      - synchronize
      - reopened
  # Cloudflare deploys the site on every push to main, so the drift check must also
  # run there: a direct push, or a PR merged after its base moved, can otherwise ship
  # a stale site with nothing to catch it. `nix-checks` shares this `on:` block too,
  # but `nix flake check` has no PR-specific behaviour, so also running it on push to
  # main is harmless.
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  nix-checks:
    name: Nix Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v31

      - name: Run flake checks
        run: nix flake check --show-trace

  docs:
    name: Docs up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            accept-flake-config = true

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install docs dependencies
        working-directory: docs
        run: bun install --frozen-lockfile

      - name: Run renderer unit tests
        working-directory: docs
        run: bun test

      - name: Typecheck the renderer
        working-directory: docs
        run: bun run typecheck

      - name: Extract keybindings from the configuration
        run: nix build '.#keymaps-json' --out-link docs/keymaps.json

      - name: Delete the committed page before regenerating
        run: rm -f docs/docs/reference/keybindings.mdx

      - name: Regenerate the keybindings page
        working-directory: docs
        run: bun run render

      - name: Fail if the committed page is stale
        run: |
          # Deleting the page above is what makes a renderer that skips its write
          # (e.g. an empty keymaps list) visible here: it stays deleted, and a
          # deletion fails the check just as a content change does. Staging first
          # is not required for that — a plain `git diff` would see it too — but
          # it keeps one form that covers modification, deletion, and re-creation
          # alike. Safe in a throwaway CI checkout: nothing downstream reads git
          # state, so staging can't leak unrelated local changes into a commit.
          git add -A -- docs/docs/reference/keybindings.mdx
          if ! git diff --cached --exit-code -- docs/docs/reference/keybindings.mdx; then
            echo "::error::The generated keybindings page is out of date. Run 'bun run gen' in docs/ and commit the result."
            exit 1
          fi

      - name: Build the site
        working-directory: docs
        run: bun run build
