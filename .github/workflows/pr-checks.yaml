name: pull-request checks

on:
  pull_request:
    types:
      - opened
      - edited
      - synchronize
      - reopened
  # Cloudflare deploys the site on every push to main, so the drift check must also
  # run there: a direct push, or a PR merged after its base moved, can otherwise ship
  # a stale site with nothing to catch it. `nix-checks` shares this `on:` block too,
  # but `nix flake check` has no PR-specific behaviour, so also running it on push to
  # main is harmless.
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  nix-checks:
    name: Nix Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v31

      - name: Run flake checks
        run: nix flake check --show-trace

  docs:
    name: Docs up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            accept-flake-config = true

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install docs dependencies
        working-directory: docs
        run: bun install --frozen-lockfile

      - name: Run renderer unit tests
        working-directory: docs
        run: bun test

      - name: Typecheck the renderer
        working-directory: docs
        run: bun run typecheck

      - name: Extract options from the configuration
        run: nix build '.#options-json' --out-link docs/options.json

      - name: Regenerate the option reference
        working-directory: docs
        run: bun run render

      - name: Fail if the committed reference is stale
        run: |
          # Safe to stage everything under this path: this is a throwaway CI
          # checkout and nothing downstream reads git state, so `git add -A` here
          # can't leak unrelated local changes into a commit.
          git add -A -- docs/docs/reference/options
          if ! git diff --cached --exit-code -- docs/docs/reference/options; then
            echo "::error::The option reference is out of date. Run 'bun run gen' in docs/ and commit the result."
            exit 1
          fi

      - name: Build the site
        working-directory: docs
        run: bun run build
