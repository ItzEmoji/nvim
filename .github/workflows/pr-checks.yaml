name: pull-request checks

on:
  pull_request:
    types:
      - opened
      - edited
      - synchronize
      - reopened

permissions:
  contents: read

jobs:
  nix-checks:
    name: Nix Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v31

      - name: Run flake checks
        run: nix flake check --show-trace

  docs:
    name: Docs up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            accept-flake-config = true

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install docs dependencies
        working-directory: docs
        run: bun install --frozen-lockfile

      - name: Run renderer unit tests
        working-directory: docs
        run: bun test

      - name: Typecheck the renderer
        working-directory: docs
        run: bun run typecheck

      - name: Extract options from the configuration
        run: nix build '.#options-json' --out-link docs/options.json

      - name: Regenerate the option reference
        working-directory: docs
        run: bun run render

      - name: Fail if the committed reference is stale
        run: |
          git add -A -- docs/docs/reference/options
          if ! git diff --cached --exit-code -- docs/docs/reference/options; then
            echo "::error::The option reference is out of date. Run 'bun run gen' in docs/ and commit the result."
            exit 1
          fi

      - name: Build the site
        working-directory: docs
        run: bun run build
