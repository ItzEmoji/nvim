name: Build nvf (x86_64, aarch64) and push to aeroflare cache
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64-linux
            runner: ubuntu-latest
          - arch: aarch64-linux
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    env:
      ATTIC_SERVER: ${{ secrets.ATTIC_SERVER }}
      ATTIC_CACHE: ${{ secrets.ATTIC_CACHE }}
      ATTIC_TOKEN: ${{ secrets.ATTIC_TOKEN }}
      NIX_CONFIG: |
        experimental-features = nix-command flakes
        accept-flake-config = true
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Nix
        uses: cachix/install-nix-action@v25
        with:
          extra_nix_config: |
            system-features = kvm big-parallel
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}

      - name: Build and cache nvf (${{ matrix.arch }})
        uses: ItzEmoji/aeroflare@v1
        with:
          config: aeroflare-ci.yaml
        env:
          NIX_SIGNING_KEY: ${{ secrets.NIX_SIGNING_KEY }} 
      - name: Report status to GitLab
        if: always()
        run: |
          case "${{ job.status }}" in
            success)   STATE="success" ;;
            failure)   STATE="failed" ;;
            cancelled) STATE="canceled" ;;
            *)         STATE="failed" ;;
          esac

          curl --request POST \
            --header "PRIVATE-TOKEN: ${{ secrets.GITLAB_TOKEN }}" \
            "https://gitlab.com/api/v4/projects/${{ vars.GITLAB_PROJECT_ID }}/statuses/${{ github.sha }}?state=$STATE&context=${{ github.job }}&target_url=${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
